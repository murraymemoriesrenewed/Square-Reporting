services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: square
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    ports:
      - "127.0.0.1:${PG_HOST_PORT:-5432}:5432"   # only reachable from this PC
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d square"]
      interval: 5s
      retries: 10
    networks:
      default:
      reporting:
        aliases: [square-db]   # hostname other containers use

  # Optional: only starts with  docker compose --profile metabase up -d
  # Skip this if you already run Metabase elsewhere.
  metabase:
    image: metabase/metabase:latest
    profiles: ["metabase"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: db
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase_app
      MB_DB_USER: ${PG_USER}
      MB_DB_PASS: ${PG_PASSWORD}
      JAVA_TIMEZONE: America/Chicago

  # Run on demand:  docker compose run --rm sync
  sync:
    build: ./sync
    profiles: ["sync"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${PG_USER}:${PG_PASSWORD}@db:5432/square
    depends_on:
      db:
        condition: service_healthy


networks:
  # Fixed name so an existing Metabase container can join it (see README)
  reporting:
    name: square-reporting

volumes:
  pgdata:
